<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="refresh" content="300" />
  <title>Job apply status</title>
  <style>
    :root { color-scheme: light dark; --bg: #f4f4f2; --fg: #1b1b18; --muted: #5c5c56; --line: #d8d8d2; --card: #fff; --accent: #0b57d0; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #161615; --fg: #f2f1ec; --muted: #a8a79d; --line: #2e2e2a; --card: #1e1e1b; --accent: #8ab4f8; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; font: 15px/1.45 system-ui, sans-serif; background: var(--bg); color: var(--fg); }
    main { max-width: 1180px; margin: 0 auto; padding: 28px 18px 64px; }
    h1 { font-size: 24px; margin: 0 0 6px; }
    h2 { font-size: 16px; margin: 28px 0 10px; }
    .muted { color: var(--muted); font-size: 13px; }
    .tabs { display: flex; gap: 8px; flex-wrap: wrap; margin: 18px 0; }
    .tab { border: 1px solid var(--line); background: var(--card); color: var(--fg); padding: 6px 12px; border-radius: 999px; cursor: pointer; }
    .tab.on { border-color: var(--accent); color: var(--accent); }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
    .stat { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
    .stat b { display: block; font-size: 22px; }
    .stat span { color: var(--muted); font-size: 12px; }
    table { width: 100%; border-collapse: collapse; background: var(--card); border: 1px solid var(--line); font-size: 13px; }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { font-size: 12px; color: var(--muted); font-weight: 600; }
    a { color: var(--accent); }
    .note { border: 1px solid var(--line); background: var(--card); padding: 12px 14px; border-radius: 10px; margin: 14px 0; }
    .err { color: #b42318; }
  </style>
</head>
<body>
  <main>
    <h1>Job apply status</h1>
    <p class="muted" id="stamp">Loading…</p>
    <p class="muted">Public snapshot of scheduler runs. No emails, phones, or resumes. Refreshes every 5 minutes. No AI involved.</p>
    <p class="note"><a href="download.html">Download 500 interview and ATS questions (PDF)</a></p>
    <div class="tabs" id="tabs"></div>
    <div id="view"></div>
  </main>
  <script>
    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const fmt = (iso) => {
      if (!iso) return "—";
      const d = new Date(iso);
      if (Number.isNaN(d.getTime())) return esc(iso);
      return d.toLocaleString();
    };
    const mins = (sec) => (sec ? (sec / 60).toFixed(1) + " min" : "—");
    const linkTitle = (j) => j.url
      ? `<a href="${esc(j.url)}" rel="noopener noreferrer" target="_blank">${esc(j.title)}</a>`
      : esc(j.title);
    let data = null;
    let active = "";

    function emptyRow(cols, msg) {
      return `<tr><td colspan="${cols}">${esc(msg)}</td></tr>`;
    }

    function render() {
      if (!data) return;
      $("stamp").textContent = "Updated " + fmt(data.updated_at);
      const users = data.users || [];
      if (!active && users[0]) active = users[0].id;
      $("tabs").innerHTML = users.map((u) =>
        `<button class="tab ${u.id === active ? "on" : ""}" data-id="${u.id}">${esc(u.name)}</button>`
      ).join("");
      $("tabs").onclick = (e) => {
        const id = e.target.dataset.id;
        if (id) { active = id; render(); }
      };
      const u = users.find((x) => x.id === active) || users[0];
      if (!u) { $("view").textContent = "No profiles yet."; return; }
      const s = u.stats || {};
      const m = u.mail || {};
      const runs = u.runs || [];
      const applied = u.applied_jobs || [];
      const desk = u.desk_jobs || [];
      const threads = u.threads || [];
      const hidden = s.hidden_other_track || 0;
      $("view").innerHTML = `
        <p class="muted">${esc((u.track_labels || []).join(" · "))}${u.headline ? " · " + esc(u.headline) : ""}</p>
        <div class="stats">
          <div class="stat"><b>${runs.length}</b><span>Scheduler cycles</span></div>
          <div class="stat"><b>${s.applied || 0}</b><span>Applications sent</span></div>
          <div class="stat"><b>${s.desk || 0}</b><span>Apply desk queue</span></div>
          <div class="stat"><b>${s.applied_this_week || 0}</b><span>Applied this week</span></div>
          <div class="stat"><b>${m.threads || 0}</b><span>Mail threads</span></div>
          <div class="stat"><b>${s.daily_remaining ?? "—"}/${s.daily_limit ?? "—"}</b><span>Email quota left today</span></div>
        </div>
        <div class="note">
          Last cycle: ${fmt(s.last_cycle_at)} · Last application: ${fmt(s.last_apply_at)}.
          ${hidden ? ` ${hidden} off-track listing(s) (e.g. Tosca/Playwright on a Teradata profile) are hidden.` : ""}
          Recruiter addresses are never published.
        </div>
        <h2>Applications sent</h2>
        <table>
          <thead><tr><th>Applied at</th><th>Company</th><th>Title</th><th>Via</th><th>Location</th><th>CTC</th><th>Score</th><th>First seen</th></tr></thead>
          <tbody>${applied.map((j) => `<tr>
            <td>${fmt(j.applied_at)}</td>
            <td>${esc(j.company)}</td>
            <td>${linkTitle(j)}</td>
            <td>${esc(j.channel || j.applied_via)}</td>
            <td>${esc(j.location || "—")}</td>
            <td>${esc(j.ctc || "unlisted")}</td>
            <td>${esc(j.score)}</td>
            <td>${fmt(j.first_seen_at)}</td>
          </tr>`).join("") || emptyRow(8, "No applications sent yet.")}</tbody>
        </table>
        <h2>Apply desk (this track only)</h2>
        <p class="muted">Matched this profile’s track, but no recruiter email / Greenhouse / Lever API — finish by hand. Sorted by score.</p>
        <table>
          <thead><tr><th>First seen</th><th>Score</th><th>Company</th><th>Title</th><th>Location</th><th>CTC</th><th>Channel</th><th>Source</th></tr></thead>
          <tbody>${desk.map((j) => `<tr>
            <td>${fmt(j.first_seen_at)}</td>
            <td>${esc(j.score)}</td>
            <td>${esc(j.company)}</td>
            <td>${linkTitle(j)}</td>
            <td>${esc(j.location || "—")}</td>
            <td>${esc(j.ctc || "unlisted")}</td>
            <td>${esc(j.channel)}</td>
            <td>${esc(j.source)}</td>
          </tr>`).join("") || emptyRow(8, "No on-track jobs waiting.")}</tbody>
        </table>
        <h2>Scheduler cycles</h2>
        <table>
          <thead><tr><th>Run</th><th>Started</th><th>Finished</th><th>Mode</th><th>Ingested</th><th>Applied</th><th>Queued</th><th>Replies</th><th>Google 429</th><th>Duration</th></tr></thead>
          <tbody>${runs.map((r) => `<tr>
            <td>#${esc(r.id)} ${esc(r.status)}</td>
            <td>${fmt(r.started_at)}</td>
            <td>${fmt(r.finished_at)}</td>
            <td>${r.live ? "live" : "dry"}</td>
            <td>${esc(r.ingested)}</td>
            <td>${esc(r.applied)}</td>
            <td>${esc(r.queued)}</td>
            <td>${esc(r.replies)}</td>
            <td>${esc(r.google_429)}</td>
            <td>${mins(r.duration_sec)}</td>
          </tr>`).join("") || emptyRow(10, "No cycles yet.")}</tbody>
        </table>
        <h2>Mail threads (no addresses)</h2>
        <table>
          <thead><tr><th>Status</th><th>Company</th><th>Title</th><th>Sent at</th><th>Last activity</th><th>Days waiting</th><th>Replies</th><th>Follow-ups</th></tr></thead>
          <tbody>${threads.map((t) => `<tr>
            <td>${esc(t.status)}</td>
            <td>${esc(t.company)}</td>
            <td>${esc(t.title)}</td>
            <td>${fmt(t.sent_at)}</td>
            <td>${fmt(t.last_activity)}</td>
            <td>${esc(t.waiting_days)}</td>
            <td>${esc(t.replies)}</td>
            <td>${esc(t.followups || 0)}</td>
          </tr>`).join("") || emptyRow(8, "No sent mail yet.")}</tbody>
        </table>
      `;
    }

    fetch("data.json?t=" + Date.now())
      .then((r) => r.json())
      .then((d) => { data = d; render(); })
      .catch((e) => { $("stamp").innerHTML = '<span class="err">Could not load data.json</span>'; console.error(e); });
  </script>
</body>
</html>
