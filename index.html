<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="refresh" content="300" />
  <title>Job apply status</title>
  <style>
    :root { color-scheme: light dark; --bg: #f4f4f2; --fg: #1b1b18; --muted: #5c5c56; --line: #d8d8d2; --card: #fff; --accent: #0b57d0; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #161615; --fg: #f2f1ec; --muted: #a8a79d; --line: #2e2e2a; --card: #1e1e1b; --accent: #8ab4f8; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; font: 15px/1.45 system-ui, sans-serif; background: var(--bg); color: var(--fg); }
    main { max-width: 1100px; margin: 0 auto; padding: 28px 18px 64px; }
    h1 { font-size: 24px; margin: 0 0 6px; }
    h2 { font-size: 16px; margin: 28px 0 10px; }
    .muted { color: var(--muted); font-size: 13px; }
    .tabs { display: flex; gap: 8px; flex-wrap: wrap; margin: 18px 0; }
    .tab { border: 1px solid var(--line); background: var(--card); color: var(--fg); padding: 6px 12px; border-radius: 999px; cursor: pointer; }
    .tab.on { border-color: var(--accent); color: var(--accent); }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
    .stat { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
    .stat b { display: block; font-size: 22px; }
    .stat span { color: var(--muted); font-size: 12px; }
    table { width: 100%; border-collapse: collapse; background: var(--card); border: 1px solid var(--line); }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { font-size: 12px; color: var(--muted); font-weight: 600; }
    a { color: var(--accent); }
    .note { border: 1px solid var(--line); background: var(--card); padding: 12px 14px; border-radius: 10px; margin: 14px 0; }
    .err { color: #b42318; }
  </style>
</head>
<body>
  <main>
    <h1>Job apply status</h1>
    <p class="muted" id="stamp">Loading…</p>
    <p class="muted">Public snapshot of scheduler runs. No emails, phones, or resumes. Refreshes every 5 minutes. No AI involved.</p>
    <div class="tabs" id="tabs"></div>
    <div id="view"></div>
  </main>
  <script>
    const $ = (id) => document.getElementById(id);
    const fmt = (iso) => {
      if (!iso) return "—";
      const d = new Date(iso);
      if (Number.isNaN(d.getTime())) return iso;
      return d.toLocaleString();
    };
    const mins = (sec) => (sec ? (sec / 60).toFixed(1) + " min" : "—");
    let data = null;
    let active = "";

    function render() {
      if (!data) return;
      $("stamp").textContent = "Updated " + fmt(data.updated_at);
      const users = data.users || [];
      if (!active && users[0]) active = users[0].id;
      $("tabs").innerHTML = users.map((u) =>
        `<button class="tab ${u.id === active ? "on" : ""}" data-id="${u.id}">${u.name}</button>`
      ).join("");
      $("tabs").onclick = (e) => {
        const id = e.target.dataset.id;
        if (id) { active = id; render(); }
      };
      const u = users.find((x) => x.id === active) || users[0];
      if (!u) { $("view").textContent = "No profiles yet."; return; }
      const s = u.stats || {};
      const m = u.mail || {};
      const runs = u.runs || [];
      const jobs = u.jobs || [];
      const threads = u.threads || [];
      $("view").innerHTML = `
        <p class="muted">${(u.track_labels || []).join(" · ")} ${u.headline ? " · " + u.headline : ""}</p>
        <div class="stats">
          <div class="stat"><b>${runs.length}</b><span>Scheduler cycles</span></div>
          <div class="stat"><b>${s.jobs || 0}</b><span>Jobs in pipeline</span></div>
          <div class="stat"><b>${s.applied || 0}</b><span>Applied total</span></div>
          <div class="stat"><b>${s.applied_this_week || 0}</b><span>Applied this week</span></div>
          <div class="stat"><b>${m.threads || 0}</b><span>Mail threads</span></div>
          <div class="stat"><b>${m.followup_due || 0}</b><span>Follow-up due</span></div>
        </div>
        <div class="note">${m.threads ? "Follow-up counts only — recruiter addresses are not published." : "No recruiter emails sent yet. Cycles keep searching for JDs with an hr@ / careers@ address."}</div>
        <h2>Scheduler cycles</h2>
        <table>
          <thead><tr><th>Run</th><th>Started</th><th>Mode</th><th>Ingested</th><th>Applied</th><th>Queued</th><th>Errors</th><th>Duration</th></tr></thead>
          <tbody>${runs.map((r) => `<tr>
            <td>#${r.id} ${r.status}</td>
            <td>${fmt(r.started_at)}</td>
            <td>${r.live ? "live" : "dry"}</td>
            <td>${r.ingested}</td>
            <td>${r.applied}</td>
            <td>${r.queued}</td>
            <td>${r.errors}</td>
            <td>${mins(r.duration_sec)}</td>
          </tr>`).join("") || `<tr><td colspan="8">No cycles yet.</td></tr>`}</tbody>
        </table>
        <h2>Matched / applied jobs</h2>
        <table>
          <thead><tr><th>ID</th><th>Status</th><th>Track</th><th>Score</th><th>Company</th><th>Title</th><th>Source</th></tr></thead>
          <tbody>${jobs.map((j) => `<tr>
            <td>#${j.id}</td>
            <td>${j.status}</td>
            <td>${j.track_label || j.track}</td>
            <td>${j.score}</td>
            <td>${j.company}</td>
            <td>${j.url ? `<a href="${j.url}" rel="noopener noreferrer" target="_blank">${j.title}</a>` : j.title}</td>
            <td>${j.source}</td>
          </tr>`).join("") || `<tr><td colspan="7">No matched jobs.</td></tr>`}</tbody>
        </table>
        <h2>Mail threads (no addresses)</h2>
        <table>
          <thead><tr><th>Status</th><th>Company</th><th>Title</th><th>Sent</th><th>Days</th><th>Replies</th></tr></thead>
          <tbody>${threads.map((t) => `<tr>
            <td>${t.status}</td>
            <td>${t.company}</td>
            <td>${t.title}</td>
            <td>${t.sent_at || "—"}</td>
            <td>${t.waiting_days}</td>
            <td>${t.replies}</td>
          </tr>`).join("") || `<tr><td colspan="6">No sent mail yet.</td></tr>`}</tbody>
        </table>
      `;
    }

    fetch("data.json?t=" + Date.now())
      .then((r) => r.json())
      .then((d) => { data = d; render(); })
      .catch((e) => { $("stamp").innerHTML = '<span class="err">Could not load data.json</span>'; console.error(e); });
  </script>
</body>
</html>
